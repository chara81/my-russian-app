  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ロシア語日課学習アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>

<body class="bg-slate-50 min-h-screen text-slate-800 p-3 sm:p-6">
  <div id="app" class="max-w-xl mx-auto"></div>

  <script>
    // --- 安全初期化 ---
    try { localStorage.removeItem('ru_app_logs'); } catch(e){}

    const SECRET_PASSWORD = "5028"; 
    const BASE_DATE_STR = "2026-10-09";

    const SENTENCES_POOL = [

      { ru: "Вы понимаете по-русски?", jp: "あなたはロシア語が分かりますか？" },
      { ru: "Они смотрят новый фильм.", jp: "彼らは新しい映画を見ています。" },
      { ru: "Я люблю слушать музыку.", jp: "私は音楽を聴くのが好きです。" },
      { ru: "Брат работает в банке.", jp: "兄は銀行で働いています。" },

      { ru: "Мой друг хорошо говорит.", jp: "私の友達は上手に話します。" },
      { ru: "Я хочу купить хлеб.", jp: "私はパンを買いたいです。" },

      { ru: "Я знаю ответ на вопрос.", jp: "私は質問の答えを知っています。" },
      { ru: "Мама готовит вкусный суп.", jp: "お母さんが美味しいスープを作っています。" },
      { ru: "У меня есть собака.", jp: "私には犬がいます。" },
      { ru: "Этот магазин открыт.", jp: "この店は開いています。" },
      { ru: "Мы слушаем радио.", jp: "私たちはラジオを聞いています。" },
      { ru: "Она идет в школу.", jp: "彼女は学校に行きます。" },
      { ru: "Сколько это стоит?", jp: "これはいくらですか？" },
      { ru: "Я изучаю историю.", jp: "私は歴史を学んでいます。" },
      { ru: "Он ждет автобус.", jp: "彼はバスを待っています。" },
      { ru: "Завтра будет солнце.", jp: "明日は晴れるでしょう。" },
      { ru: "Мы любим путешествовать.", jp: "私たちは旅行をするのが好きです。" },
      { ru: "Спасибо за помощь.", jp: "助けてくれてありがとう。" }
    ];

    const WORDS_POOL = [
      { ru: "книга", reading: "クニーガ", jp: "本" },
      { ru: "письмо", reading: "ピシモー", jp: "手紙" },
      { ru: "город", reading: "ゴーロト", jp: "街・都市" },
      { ru: "друг", reading: "ドルーグ", jp: "友達" },
      { ru: "время", reading: "ヴレーミャ", jp: "時間" },
      { ru: "работа", reading: "ラボータイ", jp: "仕事" },
      { ru: "слово", reading: "スローヴォ", jp: "言葉・単語" },
      { ru: "семья", reading: "セミヤー", jp: "家族" },
      { ru: "утро", reading: "ウートロ", jp: "朝" },
      { ru: "вечер", reading: "ヴェーチェル", jp: "夜・晩" },
      { ru: "вода", reading: "ヴァダー", jp: "水" },
      { ru: "хлеб", reading: "フレープ", jp: "パン" },
      { ru: "чай", reading: "チャイ", jp: "お茶" },
      { ru: "дом", reading: "ドム", jp: "家・建物" },
      { ru: "улица", reading: "ウーリツァ", jp: "通り・道" },
      { ru: "машина", reading: "マシーナ", jp: "車" },
      { ru: "деньги", reading: "ジエンギ", jp: "お金" },
      { ru: "человек", reading: "チェロヴェーク", jp: "人・人間" },
      { ru: "магазин", reading: "マガズィン", jp: "店・ショップ" },
      { ru: "погода", reading: "パゴーダ", jp: "天気" },
      { ru: "дверь", reading: "ドヴェーリ", jp: "ドア・扉" },
      { ru: "окно", reading: "アクノー", jp: "窓" },
      { ru: "стол", reading: "ストール", jp: "机・テーブル" },
      { ru: "стул", reading: "ストゥール", jp: "椅子" },
      { ru: "ручка", reading: "ルーチカ", jp: "ペン" },
      { ru: "тетрадь", reading: "チトラージ", jp: "ノート" },
      { ru: "яблоко", reading: "ヤーブラコ", jp: "りんご" },
      { ru: "молоко", reading: "マラコー", jp: "牛乳" },
      { ru: "рыба", reading: "ルィーバ", jp: "魚" },
      { ru: "мясо", reading: "ミャーサ", jp: "肉" }
    ];

    function getTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return y + "-" + m + "-" + d;
    }

    function addDaysToStr(dateStr, days) {
      const parts = dateStr.split('-').map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + days);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + "-" + m + "-" + day;
    }

    function loadHistoryLogs() {
      try {
        return JSON.parse(localStorage.getItem('ru_app_history_logs') || '{}');
      } catch (e) {
        return {};
      }
    }

    let state = {
      isAuthenticated: false,
      passwordInput: '',
      authError: false,
      mainTab: 'grammar',
      manualOffset: parseInt(localStorage.getItem('ru_app_manual_offset') || '0', 10),
      selectedRecordDate: getTodayStr(),
      historyLogs: loadHistoryLogs(),
      grammarSubTab: 'morning',
      grammarCardIdx: 0,
      grammarMorningRevealed: false,
      grammarNightQ5TypedText: '',
      grammarNightQ5Checked: false,
      vocabMode: 'study',
      vocabNightTyped: {},
      vocabNightChecked: {}
    };

    function getSetIndexForDate(targetDateStr) {
      const b = BASE_DATE_STR.split('-').map(Number);
      const t = targetDateStr.split('-').map(Number);
      const baseDate = new Date(b[0], b[1] - 1, b[2]);
      const targetDate = new Date(t[0], t[1] - 1, t[2]);
      const diffDays = Math.floor((targetDate.getTime() - baseDate.getTime()) / (1000 * 60 * 60 * 24));
      let cycle = Math.floor(diffDays / 2);
      if (cycle < 0) cycle = 0;
      return cycle + state.manualOffset;
    }

    function getCurrentData() {
      const setIdx = getSetIndexForDate(state.selectedRecordDate);
      const sentences = [];
      const words = [];
      for (let i = 0; i < 5; i++) {
        sentences.push(SENTENCES_POOL[(setIdx * 5 + i) % SENTENCES_POOL.length]);
        words.push(WORDS_POOL[(setIdx * 5 + i) % WORDS_POOL.length]);
      }
      return { sentences, words, setIdx };
    }

    function forceNextSet() {
      state.manualOffset += 1;
      localStorage.setItem('ru_app_manual_offset', state.manualOffset.toString());
      state.selectedRecordDate = addDaysToStr(state.selectedRecordDate, 1);
      resetLearningState();
      render();
    }

    function selectDate(dateStr) {
      state.selectedRecordDate = dateStr;
      resetLearningState();
      render();
    }

    function toggleHistory(dateStr) {
      state.historyLogs[dateStr] = !state.historyLogs[dateStr];
      localStorage.setItem('ru_app_history_logs', JSON.stringify(state.historyLogs));
      render();
    }

    function resetLearningState() {
      state.grammarCardIdx = 0;
      state.grammarMorningRevealed = false;
      state.grammarNightQ5TypedText = '';
      state.grammarNightQ5Checked = false;
      state.vocabMode = 'study';
      state.vocabNightTyped = {};
      state.vocabNightChecked = {};
    }

    function handleLogin(e) {
      e.preventDefault();
      if (state.passwordInput === SECRET_PASSWORD) {
        state.isAuthenticated = true;
        state.authError = false;
        state.passwordInput = '';
      } else {
        state.authError = true;
      }
      render();
    }

    function handleLogout() {
      state.isAuthenticated = false;
      render();
    }

    function switchMainTab(tab) {
      state.mainTab = tab;
      render();
    }

    // --- DOM構築処理（安全描画） ---
    function render() {
      const app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = ''; // クリア

      // 未認証時：ログイン画面
      if (!state.isAuthenticated) {
        const loginCard = document.createElement('div');
        loginCard.className = "bg-white rounded-2xl shadow-xl p-8 mt-12 text-center border border-slate-100";
        
        const title = document.createElement('h2');
        title.className = "text-2xl font-bold mb-2";
        title.textContent = "ロシア語学習";
        
        const desc = document.createElement('p');
        desc.className = "text-sm text-slate-500 mb-6";
        desc.textContent = "パスワードを入力してください";
        
        const form = document.createElement('form');
        form.onsubmit = handleLogin;
        form.className = "space-y-4";
        
        const passInput = document.createElement('input');
        passInput.type = "password";
        passInput.autocomplete = "new-password";
        passInput.value = state.passwordInput;
        passInput.placeholder = "パスワード";
        passInput.className = "w-full text-center px-4 py-3 rounded-xl border " + (state.authError ? 'border-red-500' : 'border-slate-300') + " focus:outline-none focus:ring-2 focus:ring-indigo-500";
        passInput.oninput = function(e) { state.passwordInput = e.target.value; };
        
        const submitBtn = document.createElement('button');
        submitBtn.type = "submit";
        submitBtn.className = "w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-indigo-700 transition";
        submitBtn.textContent = "ログイン";
        
        form.appendChild(passInput);
        if (state.authError) {
          const err = document.createElement('p');
          err.className = "text-xs text-red-500";
          err.textContent = "パスワードが違います";
          form.appendChild(err);
        }
        form.appendChild(submitBtn);
        
        loginCard.appendChild(title);
        loginCard.appendChild(desc);
        loginCard.appendChild(form);
        app.appendChild(loginCard);
        return;
      }

      // 認証済みメイン画面構築
      const currentData = getCurrentData();
      const recDate = state.selectedRecordDate;
      const isCompleted = !!state.historyLogs[recDate];
      const todayStr = getTodayStr();

      // 1. ヘッダー
      const header = document.createElement('div');
      header.className = "bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 mb-4 flex items-center justify-between";
      header.innerHTML = '<div class="font-bold text-slate-800 text-lg">ロシア語 日課学習</div>';
      
      const logoutBtn = document.createElement('button');
      logoutBtn.className = "text-xs text-slate-400 hover:text-red-500";
      logoutBtn.textContent = "ロック";
      logoutBtn.onclick = handleLogout;
      header.appendChild(logoutBtn);
      app.appendChild(header);

      // 2. 表示日・手動更新バー
      const actionBar = document.createElement('div');
      actionBar.className = "bg-indigo-900 text-white rounded-2xl p-4 shadow-sm mb-4 flex justify-between items-center";
      actionBar.innerHTML = '<div class="text-xs text-indigo-200">表示中の学習日: <span class="font-bold text-white text-sm">' + recDate + '</span></div>';
      
      const updateBtn = document.createElement('button');
      updateBtn.className = "bg-indigo-700 hover:bg-indigo-600 text-xs px-4 py-2.5 rounded-xl border border-indigo-500 font-bold transition";
      updateBtn.textContent = "手動で更新";
      updateBtn.onclick = forceNextSet;
      actionBar.appendChild(updateBtn);
      app.appendChild(actionBar);

      // 3. タブ切替
      const tabGroup = document.createElement('div');
      tabGroup.className = "grid grid-cols-2 gap-2 p-1 bg-slate-200/60 rounded-xl mb-4";
      
      const gTab = document.createElement('button');
      gTab.className = "py-2.5 rounded-lg text-sm font-bold transition " + (state.mainTab === 'grammar' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600');
      gTab.textContent = "文法";
      gTab.onclick = function() { switchMainTab('grammar'); };
      
      const vTab = document.createElement('button');
      vTab.className = "py-2.5 rounded-lg text-sm font-bold transition " + (state.mainTab === 'vocab' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600');
      vTab.textContent = "単語";
      vTab.onclick = function() { switchMainTab('vocab'); };
      
      tabGroup.appendChild(gTab);
      tabGroup.appendChild(vTab);
      app.appendChild(tabGroup);

      // 4. メインコンテンツ領域（文法 / 単語）
      const contentCard = document.createElement('div');
      contentCard.className = "bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 mb-6";
      
      if (state.mainTab === 'grammar') {
        renderGrammarToElement(contentCard, currentData.sentences);
      } else {
        renderVocabToElement(contentCard, currentData.words);
      }
      app.appendChild(contentCard);

      // 5. 実施記録＆月間カレンダー領域
      const recCard = document.createElement('div');
      recCard.className = "bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80";
      
      const recTitle = document.createElement('div');
      recTitle.className = "text-sm font-bold text-slate-700 mb-3";
      recTitle.textContent = "実施記録";
      recCard.appendChild(recTitle);

      const recStatusRow = document.createElement('div');
      recStatusRow.className = "flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100 mb-4";
      
      const dateLabel = document.createElement('div');
      dateLabel.className = "text-xs font-bold text-slate-600";
      dateLabel.textContent = recDate + " の記録";
      
      const toggleBtn = document.createElement('button');
      toggleBtn.className = "px-3 py-1.5 rounded-lg border text-xs font-bold transition " + (isCompleted ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-white text-slate-400 border-slate-200');
      toggleBtn.textContent = isCompleted ? '✓ 完了' : '○ 未完了';
      toggleBtn.onclick = function() { toggleHistory(recDate); };
      
      recStatusRow.appendChild(dateLabel);
      recStatusRow.appendChild(toggleBtn);
      recCard.appendChild(recStatusRow);

      // カレンダー部
      const calBox = document.createElement('div');
      calBox.className = "border-t border-slate-100 pt-3";
      
      const dateParts = recDate.split('-').map(Number);
      const year = dateParts[0];
      const month = dateParts[1];
      const firstDay = new Date(year, month - 1, 1).getDay();
      const lastDate = new Date(year, month, 0).getDate();

      const calHeaderRow = document.createElement('div');
      calHeaderRow.className = "flex items-center justify-between mb-3";
      
      const calHeaderTitle = document.createElement('div');
      calHeaderTitle.className = "text-xs font-bold text-slate-600";
      calHeaderTitle.textContent = year + "年 " + month + "月（日付タップで復習）";
      calHeaderRow.appendChild(calHeaderTitle);

      if (recDate !== todayStr) {
        const backBtn = document.createElement('button');
        backBtn.className = "text-xs text-indigo-600 font-bold underline";
        backBtn.textContent = "今日に戻る";
        backBtn.onclick = function() { selectDate(todayStr); };
        calHeaderRow.appendChild(backBtn);
      }
      calBox.appendChild(calHeaderRow);

      // 曜日ヘッダー
      const weekHeader = document.createElement('div');
      weekHeader.className = "grid grid-cols-7 gap-1 text-center font-bold text-[11px] text-slate-400 mb-2";
      weekHeader.innerHTML = '<div class="text-rose-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-indigo-500">土</div>';
      calBox.appendChild(weekHeader);

      // カレンダーグリッド
      const grid = document.createElement('div');
      grid.className = "grid grid-cols-7 gap-1.5";

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = "h-9";
        grid.appendChild(empty);
      }

      for (let d = 1; d <= lastDate; d++) {
        const dStr = year + '-' + String(month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        const isDone = !!state.historyLogs[dStr];
        const isSelected = (dStr === recDate);
        const isToday = (dStr === todayStr);

        let cardBg = 'bg-slate-100 text-slate-700';
        if (isDone) cardBg = 'bg-emerald-50 text-emerald-800 border-2 border-emerald-400 font-bold';
        if (isSelected) cardBg += ' ring-2 ring-indigo-600 shadow-md scale-105';

        const dayBtn = document.createElement('button');
        dayBtn.className = "h-10 rounded-xl flex flex-col items-center justify-center relative transition-all text-xs font-semibold " + cardBg;
        dayBtn.onclick = function() { selectDate(dStr); };
        
        const numSpan = document.createElement('span');
        numSpan.textContent = d;
        dayBtn.appendChild(numSpan);

        if (isDone) {
          const checkSpan = document.createElement('span');
          checkSpan.className = "text-[10px] text-emerald-600 font-extrabold leading-none";
          checkSpan.textContent = "✓";
          dayBtn.appendChild(checkSpan);
        }

        if (isToday) {
          const dot = document.createElement('span');
          dot.className = "absolute top-1 right-1 w-2 h-2 bg-indigo-600 rounded-full";
          dayBtn.appendChild(dot);
        }

        grid.appendChild(dayBtn);
      }

      calBox.appendChild(grid);
      recCard.appendChild(calBox);
      app.appendChild(recCard);
    }

    // 文法要素構築
    function renderGrammarToElement(container, sentences) {
      const cur = sentences[state.grammarCardIdx];
      
      const subNav = document.createElement('div');
      subNav.className = "flex border-b border-slate-100 mb-5 pb-2 space-x-4";
      
      const morningBtn = document.createElement('button');
      morningBtn.className = "text-sm font-bold pb-1 " + (state.grammarSubTab === 'morning' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-slate-400');
      morningBtn.textContent = "朝：学習";
      morningBtn.onclick = function() { state.grammarSubTab = 'morning'; render(); };
      
      const nightBtn = document.createElement('button');
      nightBtn.className = "text-sm font-bold pb-1 " + (state.grammarSubTab === 'night' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-slate-400');
      nightBtn.textContent = "夜：テスト";
      nightBtn.onclick = function() { state.grammarSubTab = 'night'; render(); };
      
      subNav.appendChild(morningBtn);
      subNav.appendChild(nightBtn);
      container.appendChild(subNav);

      const mainBox = document.createElement('div');
      mainBox.className = "text-center py-4";

      if (state.grammarSubTab === 'morning') {
        const badge = document.createElement('span');
        badge.className = "inline-block px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold mb-4";
        badge.textContent = "問題 " + (state.grammarCardIdx + 1) + " / 5";
        mainBox.appendChild(badge);

        const ruText = document.createElement('div');
        ruText.className = "text-2xl font-bold text-slate-800 mb-6";
        ruText.textContent = cur.ru;
        mainBox.appendChild(ruText);

        if (state.grammarMorningRevealed) {
          const jpText = document.createElement('div');
          jpText.className = "bg-indigo-50 p-4 rounded-xl text-indigo-900 font-medium mb-6";
          jpText.textContent = cur.jp;
          mainBox.appendChild(jpText);
        } else {
          const showBtn = document.createElement('button');
          showBtn.className = "w-full bg-slate-100 hover:bg-slate-200 text-slate-600 py-3 rounded-xl font-bold text-sm mb-6";
          showBtn.textContent = "答えを確認する";
          showBtn.onclick = function() { state.grammarMorningRevealed = true; render(); };
          mainBox.appendChild(showBtn);
        }

        const btnRow = document.createElement('div');
        btnRow.className = "flex justify-between space-x-2";

        const prevBtn = document.createElement('button');
        prevBtn.className = state.grammarCardIdx === 0 ? "opacity-30 px-4
