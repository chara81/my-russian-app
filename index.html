    function getTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return y + "-" + m + "-" + d;
    }

    function addDaysToStr(dateStr, days) {
      const parts = dateStr.split('-').map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + days);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + "-" + m + "-" + day;
    }

    function loadLogs() {
      try {
        return JSON.parse(localStorage.getItem('ru_app_history_logs') || '{}');
      } catch(e) {
        return {};
      }
    }

    let state = {
      isAuthenticated: false,
      passwordInput: '',
      authError: false,
      mainTab: 'grammar',
      manualOffset: parseInt(localStorage.getItem('ru_app_manual_offset') || '0', 10),
      selectedRecordDate: getTodayStr(),
      historyLogs: loadLogs(),
      grammarCardIdx: 0,
      grammarRevealed: false
    };

    function getSetIdx(dateStr) {
      const b = BASE_DATE_STR.split('-').map(Number);
      const t = dateStr.split('-').map(Number);
      const baseDate = new Date(b[0], b[1] - 1, b[2]);
      const targetDate = new Date(t[0], t[1] - 1, t[2]);
      const diff = Math.floor((targetDate.getTime() - baseDate.getTime()) / (86400000));
      let cycle = Math.floor(diff / 2);
      if (cycle < 0) cycle = 0;
      return cycle + state.manualOffset;
    }
