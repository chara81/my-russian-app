    function getTodayStr() {
      var now = new Date();
      var y = now.getFullYear();
      var m = String(now.getMonth() + 1);
      if (m.length < 2) m = '0' + m;
      var d = String(now.getDate());
      if (d.length < 2) d = '0' + d;
      return y + "-" + m + "-" + d;
    }

    function addDaysToStr(dateStr, days) {
      var parts = dateStr.split('-');
      var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      d.setDate(d.getDate() + days);
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1);
      if (m.length < 2) m = '0' + m;
      var day = String(d.getDate());
      if (day.length < 2) day = '0' + day;
      return y + "-" + m + "-" + day;
    }

    function safeParse(key) {
      try {
        var raw = localStorage.getItem(key);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    var state = {
      isAuthenticated: false,
      passwordInput: '',
      authError: false,
      mainTab: 'grammar',
      manualOffset: parseInt(localStorage.getItem('ru_app_manual_offset') || '0', 10),
      selectedRecordDate: getTodayStr(),
      historyLogs: safeParse('ru_app_history_logs') || {},
      grammarCardIdx: 0,
      grammarRevealed: false
    };

    function getSetIdx(dateStr) {
      var b = BASE_DATE_STR.split('-');
      var t = dateStr.split('-');
      var baseDate = new Date(parseInt(b[0],10), parseInt(b[1],10) - 1, parseInt(b[2],10));
      var targetDate = new Date(parseInt(t[0],10), parseInt(t[1],10) - 1, parseInt(t[2],10));
      var diff = Math.floor((targetDate.getTime() - baseDate.getTime()) / 86400000);
      var cycle = Math.floor(diff / 2);
      if (cycle < 0) cycle = 0;
      return cycle + state.manualOffset;
    }

    function render() {
      var app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '';

      if (!state.isAuthenticated) {
        var loginCard = document.createElement('div');
        loginCard.className = "card";
        loginCard.style.textAlign = "center";
        loginCard.style.marginTop = "40px";
        loginCard.innerHTML = '<h2 style="margin-bottom:8px;">ロシア語学習</h2><p style="font-size:12px;color:#64748b;margin-bottom:16px;">パスワードを入力してください</p>';

        var form = document.createElement('form');
        form.onsubmit = function(e) {
          e.preventDefault();
          if (state.passwordInput === SECRET_PASSWORD) {
            state.isAuthenticated = true;
            state.authError = false;
          } else {
            state.authError = true;
          }
          render();
        };

        var input = document.createElement('input');
        input.type = "password";
        input.placeholder = "パスワード";
        input.value = state.passwordInput;
        input.oninput = function(e) { state.passwordInput = e.target.value; };

        var btn = document.createElement('button');
        btn.className = "btn";
        btn.type = "submit";
        btn.textContent = "ログイン";

        form.appendChild(input);
        if (state.authError) {
          var err = document.createElement('p');
          err.style.color = "red";
          err.style.fontSize = "12px";
          err.style.marginBottom = "8px";
          err.textContent = "パスワードが違います";
          form.appendChild(err);
        }
        form.appendChild(btn);
        loginCard.appendChild(form);
        app.appendChild(loginCard);
        return;
      }

      var recDate = state.selectedRecordDate;
      var todayStr = getTodayStr();
      var setIdx = getSetIdx(recDate);
      var isDone = !!state.historyLogs[recDate];

      // 1. ヘッダー
      var header = document.createElement('div');
      header.className = "card header";
      header.innerHTML = '<strong>ロシア語 日課学習</strong>';
      var lockBtn = document.createElement('button');
      lockBtn.className = "btn btn-sub";
      lockBtn.style.width = "auto";
      lockBtn.style.padding = "4px 8px";
      lockBtn.style.fontSize = "12px";
      lockBtn.textContent = "ロック";
      lockBtn.onclick = function() { state.isAuthenticated = false; render(); };
      header.appendChild(lockBtn);
      app.appendChild(header);

      // 2. バー
      var bar = document.createElement('div');
      bar.className = "bar";
      bar.innerHTML = '<div>表示中の学習日: <strong>' + recDate + '</strong></div>';
      var nextBtn = document.createElement('button');
      nextBtn.textContent = "手動で更新";
      nextBtn.onclick = function() {
        state.manualOffset += 1;
        localStorage.setItem('ru_app_manual_offset', state.manualOffset.toString());
        state.selectedRecordDate = addDaysToStr(state.selectedRecordDate, 1);
        render();
      };
      bar.appendChild(nextBtn);
      app.appendChild(bar);

      // 3. タブ
      var tabs = document.createElement('div');
      tabs.className = "tabs";
      var gTab = document.createElement('button');
      gTab.className = "tab-btn " + (state.mainTab === 'grammar' ? 'active' : '');
      gTab.textContent = "文法";
      gTab.onclick = function() { state.mainTab = 'grammar'; render(); };

      var vTab = document.createElement('button');
      vTab.className = "tab-btn " + (state.mainTab === 'vocab' ? 'active' : '');
      vTab.textContent = "単語";
      vTab.onclick = function() { state.mainTab = 'vocab'; render(); };

      tabs.appendChild(gTab);
      tabs.appendChild(vTab);
      app.appendChild(tabs);

      // 4. メインコンテンツ
      var card = document.createElement('div');
      card.className = "card";

      if (state.mainTab === 'grammar') {
        var cur = SENTENCES_POOL[(setIdx * 5 + state.grammarCardIdx) % SENTENCES_POOL.length];
        
        var qNum = document.createElement('div');
        qNum.style.textAlign = "center";
        qNum.style.fontSize = "12px";
        qNum.style.fontWeight = "bold";
        qNum.style.color = "#4f46e5";
        qNum.style.marginBottom = "8px";
        qNum.textContent = "問題 " + (state.grammarCardIdx + 1) + " / 5";
        card.appendChild(qNum);

        var ruText = document.createElement('div');
        ruText.style.textAlign = "center";
        ruText.style.fontSize = "20px";
        ruText.style.fontWeight = "bold";
        ruText.style.marginBottom = "16px";
        ruText.textContent = cur.ru;
        card.appendChild(ruText);

        if (state.grammarRevealed) {
          var jpText = document.createElement('div');
          jpText.style.background = "#e0e7ff";
          jpText.style.padding = "12px";
          jpText.style.borderRadius = "10px";
          jpText.style.textAlign = "center";
          jpText.style.color = "#3730a3";
          jpText.style.marginBottom = "16px";
          jpText.style.fontSize = "14px";
          jpText.textContent = cur.jp;
          card.appendChild(jpText);
        } else {
          var showBtn = document.createElement('button');
          showBtn.className = "btn btn-sub";
          showBtn.style.marginBottom = "16px";
          showBtn.textContent = "答えを確認する";
          showBtn.onclick = function() { state.grammarRevealed = true; render(); };
          card.appendChild(showBtn);
        }

        var navRow = document.createElement('div');
        navRow.style.display = "flex";
        navRow.style.gap = "8px";

        var pBtn = document.createElement('button');
        pBtn.className = "btn btn-sub";
        pBtn.textContent = "前へ";
        pBtn.disabled = (state.grammarCardIdx === 0);
        if (state.grammarCardIdx === 0) pBtn.style.opacity = "0.4";
        pBtn.onclick = function() {
          state.grammarCardIdx = Math.max(0, state.grammarCardIdx - 1);
          state.grammarRevealed = false;
          render();
        };

        var nBtn = document.createElement('button');
        nBtn.className = "btn";
        nBtn.textContent = "次へ";
        nBtn.disabled = (state.grammarCardIdx === 4);
        if (state.grammarCardIdx === 4) nBtn.style.opacity = "0.4";
        nBtn.onclick = function() {
          state.grammarCardIdx = Math.min(4, state.grammarCardIdx + 1);
          state.grammarRevealed = false;
          render();
        };

        navRow.appendChild(pBtn);
        navRow.appendChild(nBtn);
        card.appendChild(navRow);
      } else {
        for (var i = 0; i < 5; i++) {
          var w = WORDS_POOL[(setIdx * 5 + i) % WORDS_POOL.length];
          var row = document.createElement('div');
          row.className = "word-row";
          row.innerHTML = '<div><strong>' + w.ru + '</strong><div style="font-size:10px;color:#4f46e5;">' + w.reading + '</div></div><div>' + w.jp + '</div>';
          card.appendChild(row);
        }
      }
      app.appendChild(card);

      // 5. 実施記録＆月間カレンダー
      var recCard = document.createElement('div');
      recCard.className = "card";

      var recHead = document.createElement('div');
      recHead.style.display = "flex";
      recHead.style.justifyContent = "space-between";
      recHead.style.alignItems = "center";
      recHead.style.marginBottom = "12px";
      recHead.innerHTML = '<span style="font-size:12px;font-weight:bold;">' + recDate + ' の記録</span>';

      var doneBtn = document.createElement('button');
      doneBtn.className = "btn " + (isDone ? '' : 'btn-sub');
      doneBtn.style.width = "auto";
      doneBtn.style.padding = "6px 12px";
      doneBtn.style.fontSize = "12px";
      doneBtn.textContent = isDone ? '✓ 完了' : '○ 未完了';
      doneBtn.onclick = function() {
        state.historyLogs[recDate] = !state.historyLogs[recDate];
        localStorage.setItem('ru_app_history_logs', JSON.stringify(state.historyLogs));
        render();
      };
      recHead.appendChild(doneBtn);
      recCard.appendChild(recHead);

      var calTitleRow = document.createElement('div');
      calTitleRow.style.display = "flex";
      calTitleRow.style.justifyContent = "space-between";
      calTitleRow.style.alignItems = "center";
      calTitleRow.style.borderTop = "1px solid #f1f5f9";
      calTitleRow.style.paddingTop = "12px";
      calTitleRow.style.marginBottom = "8px";

      var parts = recDate.split('-');
      var year = parseInt(parts[0], 10);
      var month = parseInt(parts[1], 10);

      var titleSpan = document.createElement('span');
      titleSpan.style.fontSize = "12px";
      titleSpan.style.fontWeight = "bold";
      titleSpan.style.color = "#64748b";
      titleSpan.textContent = year + "年 " + month + "月（日付タップで復習）";
      calTitleRow.appendChild(titleSpan);

      if (recDate !== todayStr) {
        var backBtn = document.createElement('button');
        backBtn.style.background = "none";
        backBtn.style.border = "none";
        backBtn.style.color = "#4f46e5";
        backBtn.style.fontSize = "12px";
        backBtn.style.fontWeight = "bold";
        backBtn.style.cursor = "pointer";
        backBtn.style.textDecoration = "underline";
        backBtn.textContent = "今日に戻る";
        backBtn.onclick = function() {
          state.selectedRecordDate = todayStr;
          render();
        };
        calTitleRow.appendChild(backBtn);
      }
      recCard.appendChild(calTitleRow);

      var weekGrid = document.createElement('div');
      weekGrid.className = "grid-7 week-head";
      weekGrid.innerHTML = '<div style="color:#ef4444;">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div style="color:#3b82f6;">土</div>';
      recCard.appendChild(weekGrid);

      var firstDay = new Date(year, month - 1, 1).getDay();
      var lastDate = new Date(year, month, 0).getDate();
      var grid = document.createElement('div');
      grid.className = "grid-7";

      for (var k = 0; k < firstDay; k++) {
        var blank = document.createElement('div');
        blank.style.height = "36px";
        grid.appendChild(blank);
      }

      for (var d = 1; d <= lastDate; d++) {
        (function(dayNum) {
          var dStr = year + '-' + (month < 10 ? '0' + month : month) + '-' + (dayNum < 10 ? '0' + dayNum : dayNum);
          var done = !!state.historyLogs[dStr];
          var selected = (dStr === recDate);
          var isToday = (dStr === todayStr);

          var dayBtn = document.createElement('div');
          dayBtn.className = "day-box " + (done ? 'done ' : '') + (selected ? 'selected' : '');
          dayBtn.onclick = function() {
            state.selectedRecordDate = dStr;
            state.grammarCardIdx = 0;
            state.grammarRevealed = false;
            render();
          };

          var numSpan = document.createElement('span');
          numSpan.textContent = dayNum;
          dayBtn.appendChild(numSpan);

          if (done) {
            var mark = document.createElement('span');
            mark.style.fontSize = "9px";
            mark.style.lineHeight = "1";
            mark.textContent = "✓";
            dayBtn.appendChild(mark);
          }

          if (isToday) {
            var dot = document.createElement('div');
            dot.className = "today-dot";
            dayBtn.appendChild(dot);
          }

          grid.appendChild(dayBtn);
        })(d);
      }

      recCard.appendChild(grid);
      app.appendChild(recCard);
    }

    render();
