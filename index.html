<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- キャッシュ無効化タグ（毎回最新コードを読み込む設定） -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ロシア語日課学習アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-3 sm:p-6">
  <div id="app" class="max-w-xl mx-auto"></div>

  <script>
    const SECRET_PASSWORD = "5028"; 
    const BASE_DATE_STR = "2026-10-09";

    const SENTENCES_POOL = [
      { ru: "Я читаю книгу.", jp: "私は本を読んでいます。" },
      { ru: "Он пишет письма.", jp: "彼は手紙を書いています。" },
      { ru: "Она изучает русский язык.", jp: "彼女はロシア語を勉強しています。" },
      { ru: "Мы живем в Токио.", jp: "私たちは東京に住んでいます。" },
      { ru: "Вы понимаете по-русски?", jp: "あなたはロシア語が分かりますか？" },
      { ru: "Они смотрят новый фильм.", jp: "彼らは新しい映画を見ています。" },
      { ru: "Я люблю слушать музыку.", jp: "私は音楽を聴くのが好きです。" },
      { ru: "Брат работает в банке.", jp: "兄は銀行で働いています。" },
      { ru: "Сестра пьет горячий чай.", jp: "姉は温かいお茶を飲んでいます。" },
      { ru: "Мой друг хорошо говорит.", jp: "私の友達は上手に話します。" },
      { ru: "Я хочу купить хлеб.", jp: "私はパンを買いたいです。" },
      { ru: "Где находится станция?", jp: "駅はどこにありますか？" },
      { ru: "Сегодня хорошая погода.", jp: "今日は良い天気です。" },
      { ru: "Мы завтракаем утром.", jp: "私たちは朝に朝食を食べます。" },
      { ru: "Он хорошо знает этот город.", jp: "彼はこの街をよく知っています。" },
      { ru: "Она пьет кофе без сахара.", jp: "彼女は砂糖なしのコーヒーを飲みます。" },
      { ru: "Вы были в Москве?", jp: "あなたはモスクワに行ったことがありますか？" },
      { ru: "Дети играют в парке.", jp: "子供たちが公園で遊んでいます。" },
      { ru: "Я знаю ответ на вопрос.", jp: "私は質問の答えを知っています。" },
      { ru: "Мама готовит вкусный суп.", jp: "お母さんが美味しいスープを作っています。" },
      { ru: "У меня есть собака.", jp: "私には犬がいます。" },
      { ru: "Этот магазин открыт.", jp: "この店は開いています。" },
      { ru: "Мы слушаем радио.", jp: "私たちはラジオを聞いています。" },
      { ru: "Она идет в школу.", jp: "彼女は学校に行きます。" },
      { ru: "Сколько это стоит?", jp: "これはいくらですか？" },
      { ru: "Я изучаю историю.", jp: "私は歴史を学んでいます。" },
      { ru: "Он ждет автобус.", jp: "彼はバスを待っています。" },
      { ru: "Завтра будет солнце.", jp: "明日は晴れるでしょう。" },
      { ru: "Мы любим путешествовать.", jp: "私たちは旅行をするのが好きです。" },
      { ru: "Спасибо за помощь.", jp: "助けてくれてありがとう。" }
    ];

    const WORDS_POOL = [
      { ru: "книга", reading: "クニーガ", jp: "本" },
      { ru: "письмо", reading: "ピシモー", jp: "手紙" },
      { ru: "город", reading: "ゴーロト", jp: "街・都市" },
      { ru: "друг", reading: "ドルーグ", jp: "友達" },
      { ru: "время", reading: "ヴレーミャ", jp: "時間" },
      { ru: "работа", reading: "ラボータイ", jp: "仕事" },
      { ru: "слово", reading: "スローヴォ", jp: "言葉・単語" },
      { ru: "семья", reading: "セミヤー", jp: "家族" },
      { ru: "утро", reading: "ウートロ", jp: "朝" },
      { ru: "вечер", reading: "ヴェーチェル", jp: "夜・晩" },
      { ru: "вода", reading: "ヴァダー", jp: "水" },
      { ru: "хлеб", reading: "フレープ", jp: "パン" },
      { ru: "чай", reading: "チャイ", jp: "お茶" },
      { ru: "дом", reading: "ドム", jp: "家・建物" },
      { ru: "улица", reading: "ウーリツァ", jp: "通り・道" },
      { ru: "машина", reading: "マシーナ", jp: "車" },
      { ru: "деньги", reading: "ジエンギ", jp: "お金" },
      { ru: "человек", reading: "チェロヴェーク", jp: "人・人間" },
      { ru: "магазин", reading: "マガズィン", jp: "店・ショップ" },
      { ru: "погода", reading: "パゴーダ", jp: "天気" },
      { ru: "дверь", reading: "ドヴェーリ", jp: "ドア・扉" },
      { ru: "окно", reading: "アクノー", jp: "窓" },
      { ru: "стол", reading: "ストール", jp: "机・テーブル" },
      { ru: "стул", reading: "ストゥール", jp: "椅子" },
      { ru: "ручка", reading: "ルーチカ", jp: "ペン" },
      { ru: "тетрадь", reading: "チトラージ", jp: "ノート" },
      { ru: "яблоко", reading: "ヤーブラコ", jp: "りんご" },
      { ru: "молоко", reading: "マラコー", jp: "牛乳" },
      { ru: "рыба", reading: "ルィーバ", jp: "魚" },
      { ru: "мясо", reading: "ミャーサ", jp: "肉" }
    ];

    function getTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return y + "-" + m + "-" + d;
    }

    let state = {
      isAuthenticated: false,
      passwordInput: '',
      authError: false,
      mainTab: 'grammar',
      selectedRecordDate: getTodayStr(),
      manualOffset: parseInt(localStorage.getItem('ru_app_manual_offset') || '0', 10),
      historyLogs: JSON.parse(localStorage.getItem('ru_app_history_logs') || '{}'),
      grammarSubTab: 'morning',
      grammarCardIdx: 0,
      grammarMorningRevealed: false,
      grammarNightQ5TypedText: '',
      grammarNightQ5Checked: false,
      vocabMode: 'study',
      vocabNightTyped: {},
      vocabNightChecked: {}
    };

    function getCurrentSetIndex() {
      const todayStr = getTodayStr();
      const b = BASE_DATE_STR.split('-').map(Number);
      const t = todayStr.split('-').map(Number);
      const baseDate = new Date(b[0], b[1] - 1, b[2]);
      const todayDate = new Date(t[0], t[1] - 1, t[2]);
      const diffDays = Math.floor((todayDate.getTime() - baseDate.getTime()) / (1000 * 60 * 60 * 24));
      let cycle = Math.floor(diffDays / 2);
      if (cycle < 0) cycle = 0;
      return cycle + state.manualOffset;
    }

    function getCurrentData() {
      const setIdx = getCurrentSetIndex();
      const sentences = [];
      const words = [];
      for (let i = 0; i < 5; i++) {
        sentences.push(SENTENCES_POOL[(setIdx * 5 + i) % SENTENCES_POOL.length]);
        words.push(WORDS_POOL[(setIdx * 5 + i) % WORDS_POOL.length]);
      }
      return { sentences, words, setIdx };
    }

    function forceNextSet() {
      state.manualOffset += 1;
      localStorage.setItem('ru_app_manual_offset', state.manualOffset.toString());
      resetLearningState();
      render();
    }

    function handleRecordDateChange(newDate) {
      if (!newDate) return;
      state.selectedRecordDate = newDate;
      render();
    }

    function toggleHistory(dateStr) {
      state.historyLogs[dateStr] = !state.historyLogs[dateStr];
      localStorage.setItem('ru_app_history_logs', JSON.stringify(state.historyLogs));
      render();
    }

    function resetLearningState() {
      state.grammarCardIdx = 0;
      state.grammarMorningRevealed = false;
      state.grammarNightQ5TypedText = '';
      state.grammarNightQ5Checked = false;
      state.vocabMode = 'study';
      state.vocabNightTyped = {};
      state.vocabNightChecked = {};
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!state.isAuthenticated) {
        app.innerHTML = 
          '<div class="bg-white rounded-2xl shadow-xl p-8 mt-12 text-center border border-slate-100">' +
            '<h2 class="text-2xl font-bold mb-2">ロシア語学習</h2>' +
            '<p class="text-sm text-slate-500 mb-6">パスワードを入力してください</p>' +
            '<form onsubmit="handleLogin(event)" class="space-y-4">' +
              '<input type="password" id="passInput" autocomplete="new-password" value="' + state.passwordInput + '" oninput="state.passwordInput = this.value" placeholder="パスワード" class="w-full text-center px-4 py-3 rounded-xl border ' + (state.authError ? 'border-red-500' : 'border-slate-300') + ' focus:outline-none focus:ring-2 focus:ring-indigo-500">' +
              (state.authError ? '<p class="text-xs text-red-500">パスワードが違います</p>' : '') +
              '<button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-indigo-700 transition">ログイン</button>' +
            '</form>' +
          '</div>';
        return;
      }

      const currentData = getCurrentData();
      const recDate = state.selectedRecordDate;
      const isCompleted = !!state.historyLogs[recDate];

      let contentHtml = '';
      if (state.mainTab === 'grammar') {
        contentHtml = renderGrammarSection(currentData.sentences);
      } else {
        contentHtml = renderVocabSection(currentData.words);
      }

      app.innerHTML = 
        '<div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 mb-4 flex items-center justify-between">' +
          '<div class="font-bold text-slate-800 text-lg">ロシア語 日課学習</div>' +
          '<button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-red-500">ロック</button>' +
        '</div>' +
        '<div class="bg-indigo-900 text-white rounded-2xl p-4 shadow-sm mb-4 flex justify-between items-center">' +
          '<div>' +
            '<div class="text-xs text-indigo-200">問題セット（2日で自動更新）</div>' +
            '<div class="text-lg font-bold">セット #' + (currentData.setIdx + 1) + '</div>' +
          '</div>' +
          '<button onclick="forceNextSet()" class="bg-indigo-700 hover:bg-indigo-600 text-xs px-3 py-2 rounded-xl border border-indigo-500">手動で更新</button>' +
        '</div>' +
        '<div class="grid grid-cols-2 gap-2 p-1 bg-slate-200/60 rounded-xl mb-4">' +
          '<button onclick="switchMainTab(\'grammar\')" class="py-2.5 rounded-lg text-sm font-bold transition ' + (state.mainTab === 'grammar' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600') + '">文法</button>' +
          '<button onclick="switchMainTab(\'vocab\')" class="py-2.5 rounded-lg text-sm font-bold transition ' + (state.mainTab === 'vocab' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600') + '">単語</button>' +
        '</div>' +
        '<div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 mb-6">' +
          contentHtml +
        '</div>' +
        '<div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">' +
          '<div class="text-sm font-bold text-slate-700 mb-3">実施記録（確認用）</div>' +
          '<div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">' +
            '<input type="date" value="' + recDate + '" onchange="handleRecordDateChange(this.value)" class="bg-white border border-slate-200 text-slate-700 font-bold text-xs p-1.5 rounded-lg focus:outline-none">' +
            '<button onclick="toggleHistory(\'' + recDate + '\')" class="px-3 py-1.5 rounded-lg border text-xs font-bold transition ' + (isCompleted ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-white text-slate-400 border-slate-200') + '">' +
              (isCompleted ? '✓ 完了' : '○ 未完了') +
            '</button>' +
          '</div>' +
        '</div>';
    }

    function renderGrammarSection(sentences) {
      const cur = sentences[state.grammarCardIdx];
      if (state.grammarSubTab === 'morning') {
        return '<div class="flex border-b border-slate-100 mb-5 pb-2 space-x-4">' +
            '<button onclick="state.grammarSubTab = \'morning\'; render();" class="text-sm font-bold pb-1 border-b-2 border-indigo-600 text-indigo-600">朝：学習</button>' +
            '<button onclick="state.grammarSubTab = \'night\'; render();" class="text-sm font-bold pb-1 text-slate-400">夜：テスト</button>' +
          '</div>' +
          '<div class="text-center py-4">' +
            '<span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold mb-4">問題 ' + (state.grammarCardIdx + 1) + ' / 5</span>' +
            '<div class="text-2xl font-bold text-slate-800 mb-6">' + cur.ru + '</div>' +
            (state.grammarMorningRevealed ? 
              '<div class="bg-indigo-50 p-4 rounded-xl text-indigo-900 font-medium mb-6">' + cur.jp + '</div>' : 
              '<button onclick="state.grammarMorningRevealed = true; render();" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 py-3 rounded-xl font-bold text-sm mb-6">答えを確認する</button>'
            ) +
            '<div class="flex justify-between space-x-2">' +
              '<button onclick="state.grammarCardIdx = Math.max(0, state.grammarCardIdx - 1); state.grammarMorningRevealed = false; render();" ' + (state.grammarCardIdx === 0 ? 'disabled class="opacity-30 px-4 py-2 bg-slate-100 rounded-lg"' : 'class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-bold text-slate-600"') + '>前へ</button>' +
              '<button onclick="state.grammarCardIdx = Math.min(4, state.grammarCardIdx + 1); state.grammarMorningRevealed = false; render();" ' + (state.grammarCardIdx === 4 ? 'disabled class="opacity-30 px-4 py-2 bg-slate-100 rounded-lg"' : 'class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold"') + '>次へ</button>' +
            '</div>' +
          '</div>';
      } else {
        if (state.grammarCardIdx < 4) {
          return '<div class="flex border-b border-slate-100 mb-5 pb-2 space-x-4">' +
              '<button onclick="state.grammarSubTab = \'morning\'; render();" class="text-sm font-bold pb-1 text-slate-400">朝：学習</button>' +
              '<button onclick="state.grammarSubTab = \'night\'; render();" class="text-sm font-bold pb-1 border-b-2 border-indigo-600 text-indigo-600">夜：テスト</button>' +
            '</div>' +
            '<div class="text-center py-4">' +
              '<div class="flex justify-between items-center mb-4">' +
                '<span class="px-3 py-1 bg-amber-50 text-amber-600 rounded-full text-xs font-bold">1〜4問目：復習</span>' +
                '<span class="text-xs text-slate-400">' + (state.grammarCardIdx + 1) + ' / 5</span>' +
              '</div>' +
              '<div class="text-2xl font-bold text-slate-800 mb-6">' + cur.ru + '</div>' +
              (state.grammarMorningRevealed ? 
                '<div class="bg-amber-50 p-4 rounded-xl text-amber-900 font-medium mb-6">' + cur.jp + '</div>' : 
                '<button onclick="state.grammarMorningRevealed = true; render();" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 py-3 rounded-xl font-bold text-sm mb-6">日本語訳を確認する</button>'
              ) +
              '<button onclick="state.grammarCardIdx++; state.grammarMorningRevealed = false; render();" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">次の問題へ</button>' +
            '</div>';
        } else {
          return '<div class="flex border-b border-slate-100 mb-5 pb-2 space-x-4">' +
              '<button onclick="state.grammarSubTab = \'morning\'; render();" class="text-sm font-bold pb-1 text-slate-400">朝：学習</button>' +
              '<button onclick="state.grammarSubTab = \'night\'; render();" class="text-sm font-bold pb-1 border-b-2 border-indigo-600 text-indigo-600">夜：テスト</button>' +
            '</div>' +
            '<div class="py-2">' +
              '<span class="px-3 py-1 bg-rose-50 text-rose-600 rounded-full text-xs font-bold mb-4 inline-block">5問目：タイピング</span>' +
              '<div class="text-xl font-bold text-slate-800 mb-4 bg-slate-50 p-3 rounded-xl border">' + cur.jp + '</div>' +
              '<input type="text" value="' + state.grammarNightQ5TypedText + '" oninput="state.grammarNightQ5TypedText = this.value" placeholder="ロシア語を入力..." class="w-full p-3 border rounded-xl mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">' +
              '<button onclick="state.grammarNightQ5Checked = true; render();" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl mb-3">判定</button>' +
              (state.grammarNightQ5Checked ? 
                '<div class="p-4 rounded-xl ' + (state.grammarNightQ5TypedText.trim() === cur.ru ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-800') + '">' +
                  '<p class="font-bold mb-1">' + (state.grammarNightQ5TypedText.trim() === cur.ru ? '◯ 正解です！' : '× 残念！') + '</p>' +
                  '<p class="text-sm">正解: ' + cur.ru + '</p>' +
                '</div>' : ''
              ) +
              '<button onclick="state.grammarCardIdx = 0; state.grammarNightQ5Checked = false; state.grammarNightQ5TypedText = \'\'; render();" class="w-full mt-4 text-xs text-slate-400 text-center">最初からやり直す</button>' +
            '</div>';
        }
      }
    }

    function renderVocabSection(words) {
      if (state.vocabMode === 'study') {
        let listHtml = words.map(function(w) {
          return '<div class="p-3.5 bg-slate-50 border rounded-xl flex items-center justify-between">' +
              '<div>' +
                '<div class="font-bold text-slate-800 text-lg">' + w.ru + '</div>' +
                '<div class="text-xs text-indigo-600 font-medium">' + w.reading + '</div>' +
              '</div>' +
              '<div class="font-bold text-slate-700">' + w.jp + '</div>' +
            '</div>';
        }).join('');

        return '<div class="space-y-3 mb-6">' + listHtml + '</div>' +
          '<button onclick="state.vocabMode = \'test\'; state.vocabNightChecked = {}; state.vocabNightTyped = {}; render();" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow hover:bg-indigo-700 transition">テストを開始する</button>';
      } else {
        let testHtml = words.map(function(w, idx) {
          return '<div class="p-3 bg-slate-50 border rounded-xl space-y-2">' +
              '<div class="text-sm font-bold text-slate-800">' + w.jp + ' (' + w.reading + ')</div>' +
              '<input type="text" oninput="state.vocabNightTyped[' + idx + '] = this.value" value="' + (state.vocabNightTyped[idx] || '') + '" placeholder="ロシア語を入力..." class="w-full p-2 text-sm border rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">' +
              '<button onclick="state.vocabNightChecked[' + idx + '] = true; render();" class="w-full py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-lg">判定</button>' +
              (state.vocabNightChecked[idx] ? 
                '<div class="text-xs font-bold ' + ((state.vocabNightTyped[idx]||'').trim() === w.ru ? 'text-emerald-600' : 'text-rose-600') + '">' +
                  ((state.vocabNightTyped[idx]||'').trim() === w.ru ? '◯ 正解！' : '× 正解: ' + w.ru) +
                '</div>' : ''
              ) +
            '</div>';
        }).join('');

        return '<div class="flex justify-between items-center mb-4 pb-2 border-b">' +
            '<span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">単語テスト</span>' +
            '<button onclick="state.vocabMode = \'study\'; render();" class="text-xs text-slate-400">一覧に戻る</button>' +
          '</div>' +
          '<div class="space-y-4">' + testHtml + '</div>';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      if (state.passwordInput === SECRET_PASSWORD) {
        state.isAuthenticated = true;
        state.authError = false;
        state.passwordInput = '';
      } else {
        state.authError = true;
      }
      render();
    }

    function handleLogout() {
      state.isAuthenticated = false;
      render();
    }

    function switchMainTab(tab) {
      state.mainTab = tab;
      render();
    }

    render();
  </script>
</body>
</html>
