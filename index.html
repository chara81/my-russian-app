<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ロシア語日課学習アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-3 sm:p-6">
  <div id="app" class="max-w-xl mx-auto"></div>

  <script>
    // --- パスワード設定 ---
    const SECRET_PASSWORD = "5028"; 

    // --- プールデータ ---
    const SENTENCES_POOL = [
      { ru: "Я читаю книгу.", jp: "私は本を読んでいます。" },
      { ru: "Он пишет письма.", jp: "彼は手紙を書いています。" },
      { ru: "Она изучает русский язык.", jp: "彼女はロシア語を勉強しています。" },
      { ru: "Мы живем в Токио.", jp: "私たちは東京に住んでいます。" },
      { ru: "Вы понимаете по-русски?", jp: "あなたはロシア語が分かりますか？" },
      { ru: "Они смотрят новый фильм.", jp: "彼らは新しい映画を見ています。" },
      { ru: "Я люблю слушать музыку.", jp: "私は音楽を聴くのが好きです。" },
      { ru: "Брат работает в банке.", jp: "兄は銀行で働いています。" },
      { ru: "Сестра пьет горячий чай.", jp: "姉は温かいお茶を飲んでいます。" },
      { ru: "Мой друг хорошо говорит.", jp: "私の友達は上手に話します。" }
    ];

    const WORDS_POOL = [
      { ru: "книга", reading: "クニーガ", jp: "本" },
      { ru: "письмо", reading: "ピシモー", jp: "手紙" },
      { ru: "город", reading: "ゴーロト", jp: "街・都市" },
      { ru: "друг", reading: "ドルーグ", jp: "友達" },
      { ru: "время", reading: "ヴレーミャ", jp: "時間" },
      { ru: "работа", reading: "ラボータイ", jp: "仕事" },
      { ru: "слово", reading: "スローヴォ", jp: "言葉・単語" },
      { ru: "семья", reading: "セミヤー", jp: "家族" },
      { ru: "утро", reading: "ウートロ", jp: "朝" },
      { ru: "вечер", reading: "ヴェーチェル", jp: "夜・晩" }
    ];

    // 本日の日付（文字列 YYYY-MM-DD）
    const TODAY_STR = new Date().toISOString().split('T')[0];

    // --- アプリの状態 (State) ---
    let state = {
      isAuthenticated: false,
      passwordInput: '',
      authError: false,
      
      // カレンダー表示用（過去の達成記録確認専用）
      viewDate: TODAY_STR,
      
      // 学習コンテンツのセット番号 (日付が変わるか更新ボタンでカウントアップ)
      setIndex: parseInt(localStorage.getItem('ru_app_set_index') || '0', 10),
      lastUpdateDate: localStorage.getItem('ru_app_last_date') || TODAY_STR,

      mainTab: 'grammar', // 'grammar' | 'vocab'
      
      // 達成記録 { "2026-10-09": { grammar: true, vocab: true } }
      logs: JSON.parse(localStorage.getItem('ru_app_logs') || '{}'),

      // 文法状態
      grammarSubTab: 'morning',
      grammarCardIdx: 0,
      grammarMorningRevealed: false,
      grammarNightQ5TypedText: '',
      grammarNightQ5Checked: false,
      
      // 単語状態
      vocabMode: 'study', // 'study' (暗記) | 'test' (テスト)
      vocabNightTyped: {},
      vocabNightChecked: {}
    };

    // 自動日付更新チェック（日付をまたいだら自動で次のセットへ）
    if (state.lastUpdateDate !== TODAY_STR) {
      state.setIndex += 1;
      state.lastUpdateDate = TODAY_STR;
      localStorage.setItem('ru_app_set_index', state.setIndex.toString());
      localStorage.setItem('ru_app_last_date', TODAY_STR);
    }

    // 現在のセットに対応する問題データを取得
    function getCurrentData() {
      const sentences = [];
      const words = [];
      for (let i = 0; i < 5; i++) {
        sentences.push(SENTENCES_POOL[(state.setIndex * 5 + i) % SENTENCES_POOL.length]);
        words.push(WORDS_POOL[(state.setIndex * 5 + i) % WORDS_POOL.length]);
      }
      return { sentences, words };
    }

    // 手動で問題セットを更新する
    function forceNextSet() {
      state.setIndex += 1;
      localStorage.setItem('ru_app_set_index', state.setIndex.toString());
      resetLearningState();
      render();
    }

    function toggleLog(type) {
      if (!state.logs[state.viewDate]) {
        state.logs[state.viewDate] = {};
      }
      state.logs[state.viewDate][type] = !state.logs[state.viewDate][type];
      localStorage.setItem('ru_app_logs', JSON.stringify(state.logs));
      render();
    }

    function resetLearningState() {
      state.grammarCardIdx = 0;
      state.grammarMorningRevealed = false;
      state.grammarNightQ5TypedText = '';
      state.grammarNightQ5Checked = false;
      state.vocabMode = 'study';
      state.vocabNightTyped = {};
      state.vocabNightChecked = {};
    }

    // --- メインレンダリング ---
    function render() {
      const app = document.getElementById('app');

      if (!state.isAuthenticated) {
        app.innerHTML = `
          <div class="bg-white rounded-2xl shadow-xl p-8 mt-12 text-center border border-slate-100">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="lock" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">自分専用 ロシア語学習</h2>
            <p class="text-sm text-slate-500 mb-6">パスワードを入力してください</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
              <input type="password" id="passInput" autocomplete="new-password" value="${state.passwordInput}" oninput="state.passwordInput = this.value" placeholder="パスワード" class="w-full text-center px-4 py-3 rounded-xl border ${state.authError ? 'border-red-500' : 'border-slate-300'} focus:outline-none focus:ring-2 focus:ring-indigo-500">
              ${state.authError ? '<p class="text-xs text-red-500">パスワードが違います</p>' : ''}
              <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-indigo-700 transition">ログイン</button>
            </form>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const currentData = getCurrentData();
      const viewLogs = state.logs[state.viewDate] || {};

      app.innerHTML = `
        <!-- カレンダーパネル（過去ログの記録・確認専用） -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 mb-3">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-1">
              <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
              <span class="text-xs font-bold text-slate-500">達成記録の確認</span>
            </div>
            <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-red-500 flex items-center space-x-1">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
              <span>ロック</span>
            </button>
          </div>
          <div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-100">
            <input type="date" value="${state.viewDate}" onchange="state.viewDate = this.value; render();" class="font-bold text-slate-700 bg-transparent focus:outline-none text-sm">
            <div class="flex space-x-2 text-xs font-bold">
              <button onclick="toggleLog('grammar')" class="px-2.5 py-1 rounded-lg border flex items-center space-x-1 ${viewLogs.grammar ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-white text-slate-400 border-slate-200'}">
                <i data-lucide="${viewLogs.grammar ? 'check-circle-2' : 'circle'}" class="w-3.5 h-3.5"></i>
                <span>文法</span>
              </button>
              <button onclick="toggleLog('vocab')" class="px-2.5 py-1 rounded-lg border flex items-center space-x-1 ${viewLogs.vocab ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-white text-slate-400 border-slate-200'}">
                <i data-lucide="${viewLogs.vocab ? 'check-circle-2' : 'circle'}" class="w-3.5 h-3.5"></i>
                <span>単語</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 現在の問題セット & 更新ボタン -->
        <div class="bg-indigo-900 text-white rounded-2xl p-4 shadow-sm mb-4 flex justify-between items-center">
          <div>
            <div class="text-xs text-indigo-200">現在の学習セット</div>
            <div class="text-lg font-bold">セット #${state.setIndex + 1}</div>
          </div>
          <button onclick="forceNextSet()" class="bg-indigo-700 hover:bg-indigo-600 text-xs px-3 py-2 rounded-xl border border-indigo-500 flex items-center space-x-1 transition">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            <span>新しい問題に更新</span>
          </button>
        </div>

        <!-- メインタブ（文法 / 単語） -->
        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-200/60 rounded-xl mb-4">
          <button onclick="switchMainTab('grammar')" class="py-2.5 rounded-lg text-sm font-bold transition ${state.mainTab === 'grammar' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
            文法
          </button>
          <button onclick="switchMainTab('vocab')" class="py-2.5 rounded-lg text-sm font-bold transition ${state.mainTab === 'vocab' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
            単語
          </button>
        </div>

        <!-- コンテンツエリア -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
          ${state.mainTab === 'grammar' 
            ? renderGrammarSection(currentData.sentences) 
            : renderVocabSection(currentData.words)}
        </div>
      `;
      lucide.createIcons();
    }

    // --- 文法セクション ---
    function renderGrammarSection(sentences) {
      const cur = sentences[state.grammarCardIdx];
      return `
        <div class="flex border-b border-slate-100 mb-5 pb-2 space-x-4">
          <button onclick="state.grammarSubTab = 'morning'; render();" class="text-sm font-bold pb-1 ${state.grammarSubTab === 'morning' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-slate-400'}">朝：学習</button>
          <button onclick="state.grammarSubTab = 'night'; render();" class="text-sm font-bold pb-1 ${state.grammarSubTab === 'night' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-slate-400'}">夜：テスト</button>
        </div>

        ${state.grammarSubTab === 'morning' ? `
          <div class="text-center py-4">
            <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold mb-4">問題 ${state.grammarCardIdx + 1} / 5</span>
            <div class="text-2xl font-bold text-slate-800 mb-6">${cur.ru}</div>${state.grammarMorningRevealed ? `
              <div class="bg-indigo-50/50 p-4 rounded-xl text-indigo-900 font-medium mb-6">${cur.jp}</div>
            ` : `
              <button onclick="state.grammarMorningRevealed = true; render();" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 py-3 rounded-xl font-bold text-sm mb-6 transition">答えを確認する</button>
            `}
            <div class="flex justify-between space-x-2">
              <button onclick="state.grammarCardIdx = Math.max(0, state.grammarCardIdx - 1); state.grammarMorningRevealed = false; render();" ${state.grammarCardIdx === 0 ? 'disabled class="opacity-30 cursor-not-allowed px-4 py-2 bg-slate-100 rounded-lg"' : 'class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-bold text-slate-600"'}>前へ</button>
              <button onclick="state.grammarCardIdx = Math.min(4, state.grammarCardIdx + 1); state.grammarMorningRevealed = false; render();" ${state.grammarCardIdx === 4 ? 'disabled class="opacity-30 cursor-not-allowed px-4 py-2 bg-slate-100 rounded-lg"' : 'class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold"'}>次へ</button>
            </div>
          </div>
        ` : `
          ${state.grammarCardIdx < 4 ? `
            <div class="text-center py-4">
              <div class="flex justify-between items-center mb-4">
                <span class="px-3 py-1 bg-amber-50 text-amber-600 rounded-full text-xs font-bold">1〜4問目：露 $\\rightarrow$ 日 復習</span>
                <span class="text-xs text-slate-400">${state.grammarCardIdx + 1} / 5</span>
              </div>
              <div class="text-2xl font-bold text-slate-800 mb-6">${cur.ru}</div>
              ${state.grammarMorningRevealed ? `
                <div class="bg-amber-50 p-4 rounded-xl text-amber-900 font-medium mb-6">${cur.jp}</div>
              ` : `
                <button onclick="state.grammarMorningRevealed = true; render();" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 py-3 rounded-xl font-bold text-sm mb-6">日本語訳を確認する</button>
              `}
              <button onclick="state.grammarCardIdx++; state.grammarMorningRevealed = false; render();" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">次の問題へ</button>
            </div>
          ` : `
            <div class="py-2">
              <span class="px-3 py-1 bg-rose-50 text-rose-600 rounded-full text-xs font-bold mb-4 inline-block">5問目：タイピングテスト</span>
              <p class="text-sm text-slate-500 mb-2">以下の日本語をロシア語で入力：</p>
              <div class="text-xl font-bold text-slate-800 mb-4 bg-slate-50 p-3 rounded-xl border">${cur.jp}</div>
              <input type="text" id="gQ5Input" value="${state.grammarNightQ5TypedText}" oninput="state.grammarNightQ5TypedText = this.value" placeholder="ロシア語を入力..." class="w-full p-3 border rounded-xl mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <button onclick="state.grammarNightQ5Checked = true; render();" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl mb-3">判定</button>
              ${state.grammarNightQ5Checked ? `
                <div class="p-4 rounded-xl ${state.grammarNightQ5TypedText.trim() === cur.ru ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'}">
                  <p class="font-bold mb-1">${state.grammarNightQ5TypedText.trim() === cur.ru ? '◯ 正解です！' : '× 残念！'}</p>
                  <p class="text-sm">正解: <span class="font-bold">${cur.ru}</span></p>
                </div>
              ` : ''}
              <button onclick="state.grammarCardIdx = 0; state.grammarNightQ5Checked = false; state.grammarNightQ5TypedText = ''; render();" class="w-full mt-4 text-xs text-slate-400 hover:underline text-center">最初からやり直す</button>
            </div>
          `}
        `}
      `;
    }

    // --- 単語セクション（シンプル表示） ---
    function renderVocabSection(words) {
      return `
        ${state.vocabMode === 'study' ? `
          <!-- 暗記モード（ロシア語・カタカナ読み・日本語） -->
          <div class="space-y-3 mb-6">
            ${words.map((w) => `
              <div class="p-3.5 bg-slate-50 border rounded-xl flex items-center justify-between">
                <div>
                  <div class="font-bold text-slate-800 text-lg">${w.ru}</div>
                  <div class="text-xs text-indigo-600 font-medium">${w.reading}</div>
                </div>
                <div class="font-bold text-slate-700">${w.jp}</div>
              </div>
            `).join('')}
          </div>
          <button onclick="state.vocabMode = 'test'; state.vocabNightChecked = {}; state.vocabNightTyped = {}; render();" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow hover:bg-indigo-700 transition flex items-center justify-center space-x-2">
            <i data-lucide="play-circle" class="w-5 h-5"></i>
            <span>テストを開始する</span>
          </button>
        ` : `
          <!-- テストモード -->
          <div class="flex justify-between items-center mb-4 pb-2 border-b">
            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">単語テスト</span>
            <button onclick="state.vocabMode = 'study'; render();" class="text-xs text-slate-400 hover:text-slate-600">一覧（暗記）に戻る</button>
          </div>

          <div class="space-y-4">
            ${words.map((w, idx) => `
              <div class="p-3 bg-slate-50 border rounded-xl space-y-2">
                <div class="text-sm font-bold text-slate-800">${w.jp} (${w.reading})</div>
                <input type="text" oninput="state.vocabNightTyped[${idx}] = this.value" value="${state.vocabNightTyped[idx] || ''}" placeholder="ロシア語を入力..." class="w-full p-2 text-sm border rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <button onclick="state.vocabNightChecked[${idx}] = true; render();" class="w-full py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-lg">判定</button>
                ${state.vocabNightChecked[idx] ? `
                  <div class="text-xs font-bold ${ (state.vocabNightTyped[idx]||'').trim() === w.ru ? 'text-emerald-600' : 'text-rose-600' }">
                    ${ (state.vocabNightTyped[idx]||'').trim() === w.ru ? '◯ 正解！' : `× 正解: ${w.ru}` }
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        `}
      `;
    }

    // --- イベント ---
    function handleLogin(e) {
      e.preventDefault();
      if (state.passwordInput === SECRET_PASSWORD) {
        state.isAuthenticated = true;
        state.authError = false;
        state.passwordInput = '';
      } else {
        state.authError = true;
      }
      render();
    }

    function handleLogout() {
      state.isAuthenticated = false;
      render();
    }

    function switchMainTab(tab) {
      state.mainTab = tab;
      render();
    }

    render();
  </script>
</body>
</html>
