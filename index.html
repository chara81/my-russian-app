    function getTodayStr() {
      var now = new Date();
      var y = now.getFullYear();
      var m = String(now.getMonth() + 1); if (m.length < 2) m = '0' + m;
      var d = String(now.getDate()); if (d.length < 2) d = '0' + d;
      return y + "-" + m + "-" + d;
    }

    function addDaysToStr(dateStr, days) {
      var parts = dateStr.split('-');
      var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      d.setDate(d.getDate() + days);
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1); if (m.length < 2) m = '0' + m;
      var day = String(d.getDate()); if (day.length < 2) day = '0' + day;
      return y + "-" + m + "-" + day;
    }

    function safeParse(key) {
      try {
        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    var state = {
      isAuthenticated: false,
      authError: false,
      mainTab: 'grammar',
      mode: 'morning',
      manualOffset: parseInt(localStorage.getItem('ru_app_manual_offset') || '0', 10),
      selectedRecordDate: getTodayStr(),
      historyLogs: safeParse('ru_app_history_logs') || {},
      reviewPool: safeParse('ru_app_review_pool') || [],
      testIdx: 0,
      testFailCount: 0,
      testInput: '',
      testFeedback: '',
      testShowAnswer: false
    };

    // 日付ごとのセットインデックス算出（1日ごとに1セット進む）
    function getDayInfo(dateStr) {
      var b = BASE_DATE_STR.split('-');
      var t = dateStr.split('-');
      var baseDate = new Date(parseInt(b[0],10), parseInt(b[1],10) - 1, parseInt(b[2],10));
      var targetDate = new Date(parseInt(t[0],10), parseInt(t[1],10) - 1, parseInt(t[2],10));
      var diffDays = Math.floor((targetDate.getTime() - baseDate.getTime()) / 86400000) + state.manualOffset;
      if (diffDays < 0) diffDays = 0;

      // 日付ごとにセット（0〜29）が進む
      var setIdx = diffDays;
      var dayInCycle = (diffDays % 2) + 1; // 奇数日(Day 1) / 偶数日(Day 2)の切り替え用
      return { setIdx: setIdx, dayInCycle: dayInCycle, totalDays: diffDays + 1 };
    }

    function saveReviewPool() {
      localStorage.setItem('ru_app_review_pool', JSON.stringify(state.reviewPool));
    }

    function addToReview(type, item) {
      var exists = state.reviewPool.some(function(r) { return r.item.ru === item.ru; });
      if (!exists) {
        state.reviewPool.push({ type: type, item: item });
        saveReviewPool();
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      var inputEl = document.getElementById('pass_input');
      if (inputEl && inputEl.value === SECRET_PASSWORD) {
        state.isAuthenticated = true;
        state.authError = false;
      } else {
        state.authError = true;
      }
      render();
    }

          } else {

              if (!userAns) return;

              var isCorrect = false;
              if (isQuestion5) {
                isCorrect = (userAns.toLowerCase() === targetAns.toLowerCase());
              } else {
                isCorrect = (targetAns.indexOf(userAns) !== -1 || userAns.indexOf(targetAns) !== -1);

                state.testFeedback = "⭕ 正解です！";

                state.testInput = '';

              var row = document.createElement('div');
              row.className = "word-row";
              row.innerHTML = '<div><strong>' + w.ru + '</strong><div style="font-size:10px;color:#4f46e5;">' + w.reading + '</div></div><div>' + w.jp + '</div>';
              card.appendChild(row);
            }
          } else {
            card.appendChild(createBadge('単語：2日目の朝（日本語からロシア語練習）'));
            for (var k = 0; k < 5; k++) {
              (function(idx) {
                var w = currentSet[idx];
                var box = document.createElement('div');
                box.className = "word-row";
                box.style.flexDirection = "column";
                box.style.alignItems = "flex-start";
                box.innerHTML = '<div style="font-size:14px;font-weight:bold;">' + w.jp + ' <span style="font-size:11px;color:#64748b;">(' + w.reading + ')</span></div>';

                var practiceIn = document.createElement('input');
                practiceIn.type = "text";
                practiceIn.placeholder = "ロシア語を練習用に入力...";
                practiceIn.style.margin = "6px 0 0 0";
                practiceIn.style.padding = "6px";
                practiceIn.style.fontSize = "12px";

                var checkBtn = document.createElement('button');
                checkBtn.className = "btn btn-sub";
                checkBtn.style.marginTop = "4px";
                checkBtn.style.padding = "4px 8px";
                checkBtn.style.fontSize = "10px";
                checkBtn.textContent = "正解を表示";

                var ansSp = document.createElement('span');
                ansSp.style.color = "#4f46e5";
                ansSp.style.fontWeight = "bold";
                ansSp.style.display = "none";
                ansSp.style.marginTop = "4px";
                ansSp.textContent = " → " + w.ru;

                checkBtn.onclick = function() {
                  ansSp.style.display = (ansSp.style.display === "none") ? "inline" : "none";
                };

                box.appendChild(practiceIn);
                box.appendChild(checkBtn);
                box.appendChild(ansSp);
                card.appendChild(box);
              })(k);
            }
          }
        } else {
          if (state.testIdx >= 5) {
            card.innerHTML = '<div style="text-align:center;padding:20px;"><h3 style="color:#10b981;margin-bottom:8px;">🎉 単語テスト完了！</h3><p style="font-size:13px;color:#64748b;">お疲れ様でした。下の記録ボタンで完了をマークしましょう。</p></div>';
          } else {
            var curW = currentSet[state.testIdx];
            var isDay1 = (dayInCycle === 1);

            card.appendChild(createBadge('単語テスト 問 ' + (state.testIdx + 1) + ' / 5 (' + (isDay1 ? 'ロシア語 → 日本語' : '日本語 → ロシア語') + ')'));

            var qText = document.createElement('div');
            qText.style.textAlign = "center";
            qText.style.fontSize = "22px";
            qText.style.fontWeight = "bold";
            qText.style.margin = "16px 0";
            qText.textContent = isDay1 ? curW.ru : curW.jp;
            card.appendChild(qText);

            var form = document.createElement('form');
            var inEl = document.createElement('input');
            inEl.type = "text";
            inEl.placeholder = isDay1 ? "日本語の意味を入力..." : "ロシア語を入力...";
            inEl.value = state.testInput;
            inEl.oninput = function(e) { state.testInput = e.target.value; };

            var subBtn = document.createElement('button');
            subBtn.className = "btn";
            subBtn.type = "submit";
            subBtn.textContent = "回答する";

            form.onsubmit = function(e) {
              e.preventDefault();
              var targetAns = isDay1 ? curW.jp : curW.ru;
              var userAns = state.testInput.trim();

              if (!userAns) return;

              var isCorrect = false;
              if (isDay1) {
                isCorrect = (targetAns.indexOf(userAns) !== -1 || userAns.indexOf(targetAns) !== -1);
              } else {
                isCorrect = (userAns.toLowerCase() === targetAns.toLowerCase());
              }

              if (isCorrect) {
                state.testFeedback = "⭕ 正解です！";
                state.testIdx++;
                state.testFailCount = 0;
                state.testInput = '';
                state.testShowAnswer = false;
              } else {
                state.testFailCount++;
                if (state.testFailCount >= 3) {
                  state.testFeedback = "❌ 3回間違えました。答えを表示し、復習リストに追加しました。";
                  state.testShowAnswer = true;
                  addToReview('単語', curW);
                } else {
                  state.testFeedback = "❌ 違います（あと " + (3 - state.testFailCount) + " 回）";
                }
              }
              render();
            };

            form.appendChild(inEl);
            form.appendChild(subBtn);
            card.appendChild(form);

            if (state.testFeedback) {
              var fb = document.createElement('div');
              fb.className = "error-text";
              fb.style.color = state.testFeedback.indexOf('⭕') !== -1 ? "#10b981" : "#ef4444";
              fb.textContent = state.testFeedback;
              card.appendChild(fb);
            }

            if (state.testShowAnswer) {
              var ansBox = document.createElement('div');
              ansBox.style.background = "#fee2e2";
              ansBox.style.padding = "12px";
              ansBox.style.borderRadius = "10px";
              ansBox.style.marginTop = "12px";
              ansBox.style.textAlign = "center";
              ansBox.innerHTML = '<strong style="color:#991b1b;">正解: ' + (isDay1 ? curW.jp : curW.ru) + '</strong>';

              var nextQBtn = document.createElement('button');
              nextQBtn.className = "btn btn-sub";
              nextQBtn.style.marginTop = "8px";
              nextQBtn.textContent = "次の問題へ";
              nextQBtn.onclick = function() {
                state.testIdx++;
                state.testFailCount = 0;
                state.testInput = '';
                state.testFeedback = '';
                state.testShowAnswer = false;
                render();
              };
              ansBox.appendChild(nextQBtn);
              card.appendChild(ansBox);
            }
          }
        }
      }

      // --- 復習リスト ---
      if (state.mainTab === 'review') {
        card.appendChild(createBadge('要復習（テストで3回間違えた問題）'));

        if (state.reviewPool.length === 0) {
          card.innerHTML += '<p style="text-align:center;font-size:13px;color:#94a3b8;padding:20px 0;">復習が必要な問題はありません！素晴らしい！</p>';
        } else {
          for (var r = 0; r < state.reviewPool.length; r++) {
            (function(index) {
              var rev = state.reviewPool[index];
              var row = document.createElement('div');
              row.className = "word-row";
              row.innerHTML = '<div><span style="font-size:10px;color:#ef4444;font-weight:bold;">[' + rev.type + ']</span> <strong>' + rev.item.ru + '</strong></div><div>' + rev.item.jp + '</div>';

              var delBtn = document.createElement('button');
              delBtn.className = "btn btn-sub";
              delBtn.style.width = "auto";
              delBtn.style.padding = "4px 8px";
              delBtn.style.fontSize = "10px";
              delBtn.style.marginLeft = "8px";
              delBtn.textContent = "削除";
              delBtn.onclick = function() {
                state.reviewPool.splice(index, 1);
                saveReviewPool();
                render();
              };

              row.appendChild(delBtn);
              card.appendChild(row);
            })(r);
          }
        }
      }

      app.appendChild(card);

      // --- 実施記録＆月間カレンダー ---
      var recCard = document.createElement('div');
      recCard.className = "card";

      var recHead = document.createElement('div');
      recHead.style.display = "flex";
      recHead.style.justifyContent = "space-between";
      recHead.style.alignItems = "center";
      recHead.style.marginBottom = "12px";
      recHead.innerHTML = '<span style="font-size:12px;font-weight:bold;">' + recDate + ' の完了記録</span>';

      var doneBtn = document.createElement('button');
      doneBtn.className = "btn " + (isDone ? 'btn-success' : 'btn-sub');
      doneBtn.style.width = "auto";
      doneBtn.style.padding = "6px 12px";
      doneBtn.style.fontSize = "12px";
      doneBtn.textContent = isDone ? '✓ 本日の学習完了！' : '○ 未完了';
      doneBtn.onclick = function() {
        state.historyLogs[recDate] = !state.historyLogs[recDate];
        localStorage.setItem('ru_app_history_logs', JSON.stringify(state.historyLogs));
        render();
      };
      recHead.appendChild(doneBtn);
      recCard.appendChild(recHead);

      var calTitleRow = document.createElement('div');
      calTitleRow.style.display = "flex";
      calTitleRow.style.justifyContent = "space-between";
      calTitleRow.style.alignItems = "center";
      calTitleRow.style.borderTop = "1px solid #f1f5f9";
      calTitleRow.style.paddingTop = "12px";
      calTitleRow.style.marginBottom = "8px";

      var parts = recDate.split('-');
      var year = parseInt(parts[0], 10);
      var month = parseInt(parts[1], 10);

      var titleSpan = document.createElement('span');
      titleSpan.style.fontSize = "12px";
      titleSpan.style.fontWeight = "bold";
      titleSpan.style.color = "#64748b";
      titleSpan.textContent = year + "年 " + month + "月（タップで過去日の学習へ）";
      calTitleRow.appendChild(titleSpan);

      if (recDate !== todayStr) {
        var backBtn = document.createElement('button');
        backBtn.style.background = "none";
        backBtn.style.border = "none";
        backBtn.style.color = "#4f46e5";
        backBtn.style.fontSize = "12px";
        backBtn.style.fontWeight = "bold";
        backBtn.style.cursor = "pointer";
        backBtn.style.textDecoration = "underline";
        backBtn.textContent = "今日に戻る";
        backBtn.onclick = function() {
          state.selectedRecordDate = todayStr;
          state.testIdx = 0; state.testFailCount = 0; state.testFeedback = ''; state.testShowAnswer = false;
          render();
        };
        calTitleRow.appendChild(backBtn);
      }
      recCard.appendChild(calTitleRow);

      var weekGrid = document.createElement('div');
      weekGrid.className = "grid-7 week-head";
      weekGrid.innerHTML = '<div style="color:#ef4444;">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div style="color:#3b82f6;">土</div>';
      recCard.appendChild(weekGrid);

      var firstDay = new Date(year, month - 1, 1).getDay();
      var lastDate = new Date(year, month, 0).getDate();
      var grid = document.createElement('div');
      grid.className = "grid-7";

      for (var k = 0; k < firstDay; k++) {
        var blank = document.createElement('div');
        blank.style.height = "36px";
        grid.appendChild(blank);
      }

      for (var d = 1; d <= lastDate; d++) {
        (function(dayNum) {
          var dStr = year + '-' + (month < 10 ? '0' + month : month) + '-' + (dayNum < 10 ? '0' + dayNum : dayNum);
          var done = !!state.historyLogs[dStr];
          var selected = (dStr === recDate);
          var isToday = (dStr === todayStr);

          var dayBtn = document.createElement('div');
          dayBtn.className = "day-box " + (done ? 'done ' : '') + (selected ? 'selected' : '');
          dayBtn.onclick = function() {
            state.selectedRecordDate = dStr;
            state.testIdx = 0; state.testFailCount = 0; state.testFeedback = ''; state.testShowAnswer = false;
            render();
          };

          var numSpan = document.createElement('span');
          numSpan.textContent = dayNum;
          dayBtn.appendChild(numSpan);

          if (done) {
            var mark = document.createElement('span');
            mark.style.fontSize = "9px";
            mark.style.lineHeight = "1";
            mark.textContent = "✓";
            dayBtn.appendChild(mark);
          }

          if (isToday) {
            var dot = document.createElement('div');
            dot.className = "today-dot";
            dayBtn.appendChild(dot);
          }

          grid.appendChild(dayBtn);
        })(d);
      }

      recCard.appendChild(grid);
      app.appendChild(recCard);
    }

    function createBadge(text) {
      var badge = document.createElement('div');
      badge.className = "badge";
      badge.textContent = text;
      return badge;
    }

    render();
  </script>
</body>
</html>
