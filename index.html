<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ロシア語日課学習アプリ</title>
  <style>
    body { font-family: sans-serif; background-color: #f8fafc; color: #1e293b; padding: 16px; margin: 0; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: #ffffff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
    .btn { background: #4f46e5; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .day-box { padding: 10px 0; background: #f1f5f9; border-radius: 8px; font-size: 12px; cursor: pointer; border: 1px solid transparent; }
    .day-box.done { background: #dcfce7; border-color: #86efac; color: #166534; font-weight: bold; }
    .day-box.selected { border-color: #4f46e5; border-width: 2px; }
    .tab-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: #e2e8f0; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #ffffff; color: #4f46e5; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="app" class="container"></div>

  <script>
    // 自動キャッシュ更新（URL手入力不要）
    if (!window.location.search.includes('v=')) {
      window.location.replace(window.location.protocol + "//" + window.location.host + window.location.pathname + '?v=' + Date.now());
    }

    const SECRET_PASSWORD = "5028";
    const BASE_DATE_STR = "2026-10-09";

    const SENTENCES_POOL = [
      { ru: "Я читаю книгу.", jp: "私は本を読んでいます。" },
      { ru: "Он пишет письма.", jp: "彼は手紙を書いています。" },
      { ru: "Она изучает русский язык.", jp: "彼女はロシア語を勉強しています。" },
      { ru: "Мы живем в Токио.", jp: "私たちは東京に住んでいます。" },
      { ru: "Вы понимаете по-русски?", jp: "あなたはロシア語が分かりますか？" }
    ];

    const WORDS_POOL = [
      { ru: "книга", reading: "クニーガ", jp: "本" },
      { ru: "письмо", reading: "ピシモー", jp: "手紙" },
      { ru: "город", reading: "ゴーロト", jp: "街・都市" },
      { ru: "друг", reading: "ドルーグ", jp: "友達" },
      { ru: "время", reading: "ヴレーミャ", jp: "時間" }
    ];

    function getTodayStr() {
      const now = new Date();
      return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, '0') + "-" + String(now.getDate()).padStart(2, '0');
    }

    let state = {
      isAuthenticated: false,
      passwordInput: '',
      authError: false,
      mainTab: 'grammar',
      manualOffset: parseInt(localStorage.getItem('ru_app_manual_offset') || '0', 10),
      selectedRecordDate: getTodayStr(),
      historyLogs: JSON.parse(localStorage.getItem('ru_app_history_logs') || '{}'),
      grammarCardIdx: 0,
      grammarRevealed: false
    };

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = '';

      if (!state.isAuthenticated) {
        app.innerHTML = `
          <div class="card" style="text-align: center; margin-top: 40px;">
            <h2>ロシア語学習</h2>
            <p style="font-size: 14px; color: #64748b;">パスワードを入力してください</p>
            <form onsubmit="handleLogin(event)">
              <input type="password" value="${state.passwordInput}" oninput="state.passwordInput = this.value" placeholder="パスワード">
              ${state.authError ? '<p style="color: red; font-size: 12px;">パスワードが違います</p>' : ''}
              <button class="btn" type="submit">ログイン</button>
            </form>
          </div>
        `;
        return;
      }

      const recDate = state.selectedRecordDate;
      const isDone = !!state.historyLogs[recDate];
      const curSentence = SENTENCES_POOL[state.grammarCardIdx % SENTENCES_POOL.length];

      app.innerHTML = `
        <div class="card header">
          <strong>ロシア語 日課学習</strong>
          <button class="btn btn-secondary" style="width: auto; padding: 4px 8px; font-size: 12px;" onclick="state.isAuthenticated=false; render();">ロック</button>
        </div>

        <div class="tab-group">
          <button class="tab-btn ${state.mainTab === 'grammar' ? 'active' : ''}" onclick="state.mainTab='grammar'; render();">文法</button>
          <button class="tab-btn ${state.mainTab === 'vocab' ? 'active' : ''}" onclick="state.mainTab='vocab'; render();">単語</button>
        </div>

        <div class="card">
          ${state.mainTab === 'grammar' ? `
            <div style="text-align: center;">
              <h3>${curSentence.ru}</h3>${state.grammarRevealed ? `<p style="color: #4f46e5;">${curSentence.jp}</p>` : `<button class="btn btn-secondary" onclick="state.grammarRevealed=true; render();">答えを確認</button>`}
              <div style="display: flex; gap: 8px; margin-top: 16px;">
                <button class="btn btn-secondary" onclick="state.grammarCardIdx=Math.max(0, state.grammarCardIdx-1); state.grammarRevealed=false; render();">前へ</button>
                <button class="btn" onclick="state.grammarCardIdx=Math.min(SENTENCES_POOL.length-1, state.grammarCardIdx+1); state.grammarRevealed=false; render();">次へ</button>
              </div>
            </div>
          ` : `
            <div>
              ${WORDS_POOL.map(w => `<div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9;"><strong>${w.ru}</strong><span>${w.jp}</span></div>`).join('')}
            </div>
          `}
        </div>

        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <strong>実施記録 (${recDate})</strong>
            <button class="btn ${isDone ? 'btn-secondary' : ''}" style="width: auto; margin: 0;" onclick="toggleHistory('${recDate}')">
              ${isDone ? '✓ 完了済み' : '未完了'}
            </button>
          </div>
          
          <div style="font-size: 12px; color: #64748b; margin-bottom: 8px;">日付を選択して振り返り:</div>
          <div class="grid-7">
            ${Array.from({length: 31}, (_, i) => {
              const d = i + 1;
              const dateStr = `2026-10-${String(d).padStart(2, '0')}`;
              const done = !!state.historyLogs[dateStr];
              const selected = dateStr === recDate;
              return `<div class="day-box ${done ? 'done' : ''} ${selected ? 'selected' : ''}" onclick="selectDate('${dateStr}')">${d}<br>${done ? '✓' : ''}</div>`;
            }).join('')}
          </div>
        </div>
      `;
    }

    function handleLogin(e) {
      e.preventDefault();
      if (state.passwordInput === SECRET_PASSWORD) {
        state.isAuthenticated = true;
        state.authError = false;
      } else {
        state.authError = true;
      }
      render();
    }

    function selectDate(dStr) {
      state.selectedRecordDate = dStr;
      render();
    }

    function toggleHistory(dStr) {
      state.historyLogs[dStr] = !state.historyLogs[dStr];
      localStorage.setItem('ru_app_history_logs', JSON.stringify(state.historyLogs));
      render();
    }

    render();
  </script>
</body>
</html>
