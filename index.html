    (function autoCacheBust() {
      if (!window.location.search.includes('v=')) {
        const timestamp = new Date().getTime();
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?v=' + timestamp;
        window.location.replace(newUrl);
      }
    })();

        const val = localStorage.getItem(k);
        if (val && !val.startsWith('{')) localStorage.removeItem(k);
      });

    function getTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return y + "-" + m + "-" + d;
    }

    function addDaysToStr(dateStr, days) {
      const parts = dateStr.split('-').map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + days);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + "-" + m + "-" + day;
    }

    function safeLoadLogs() {
      try {
        const raw = localStorage.getItem('ru_app_history_logs');
        return raw ? JSON.parse(raw) : {};
      } catch(e) {
        return {};
      }
    }

    let state = {
      isAuthenticated: false,
      passwordInput: '',
      authError: false,
      mainTab: 'grammar',
      manualOffset: parseInt(localStorage.getItem('ru_app_manual_offset') || '0', 10),
      selectedRecordDate: getTodayStr(),
      historyLogs: safeLoadLogs(),
      grammarSubTab: 'morning',
      grammarCardIdx: 0,
      grammarMorningRevealed: false,
      grammarNightQ5TypedText: '',
      grammarNightQ5Checked: false,
      vocabMode: 'study',
      vocabNightTyped: {},
      vocabNightChecked: {}
    };

    function getSetIndexForDate(targetDateStr) {
      const b = BASE_DATE_STR.split('-').map(Number);
      const t = targetDateStr.split('-').map(Number);
      const baseDate = new Date(b[0], b[1] - 1, b[2]);
      const targetDate = new Date(t[0], t[1] - 1, t[2]);
      const diffDays = Math.floor((targetDate.getTime() - baseDate.getTime()) / (1000 * 60 * 60 * 24));
      let cycle = Math.floor(diffDays / 2);
      if (cycle < 0) cycle = 0;
      return cycle + state.manualOffset;
    }

    function getCurrentData() {
      const setIdx = getSetIndexForDate(state.selectedRecordDate);
      const sentences = [];
      const words = [];
      for (let i = 0; i < 5; i++) {
        sentences.push(SENTENCES_POOL[(setIdx * 5 + i) % SENTENCES_POOL.length]);
        words.push(WORDS_POOL[(setIdx * 5 + i) % WORDS_POOL.length]);
      }
      return { sentences, words, setIdx };
    }

    function forceNextSet() {
      state.manualOffset += 1;
      localStorage.setItem('ru_app_manual_offset', state.manualOffset.toString());
      state.selectedRecordDate = addDaysToStr(state.selectedRecordDate, 1);
      resetLearningState();
      render();
    }

    function selectDate(dateStr) {
      state.selectedRecordDate = dateStr;
      resetLearningState();
      render();
    }

    function toggleHistory(dateStr) {
      state.historyLogs[dateStr] = !state.historyLogs[dateStr];
      try {
        localStorage.setItem('ru_app_history_logs', JSON.stringify(state.historyLogs));
      } catch(e) {}
      render();
    }

    function resetLearningState() {
      state.grammarCardIdx = 0;
      state.grammarMorningRevealed = false;
      state.grammarNightQ5TypedText = '';
      state.grammarNightQ5Checked = false;
      state.vocabMode = 'study';
      state.vocabNightTyped = {};
      state.vocabNightChecked = {};
    }

    function handleLogin(e) {
      e.preventDefault();
      if (state.passwordInput === SECRET_PASSWORD) {
        state.isAuthenticated = true;
        state.authError = false;
        state.passwordInput = '';
      } else {
        state.authError = true;
      }
      render();
    }

    function handleLogout() {
      state.isAuthenticated = false;
      render();
    }

    function switchMainTab(tab) {
      state.mainTab = tab;
      render();
    }

    function renderGrammar(container, sentences) {
      const cur = sentences[state.grammarCardIdx];
      
      const subNav = document.createElement('div');
      subNav.className = "flex border-b border-slate-100 mb-5 pb-2 space-x-4";
      
      const mBtn = document.createElement('button');
      mBtn.className = "text-sm font-bold pb-1 " + (state.grammarSubTab === 'morning' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-slate-400');
      mBtn.textContent = "朝：学習";
      mBtn.onclick = function() { state.grammarSubTab = 'morning'; render(); };
      
      const nBtn = document.createElement('button');
      nBtn.className = "text-sm font-bold pb-1 " + (state.grammarSubTab === 'night' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-slate-400');
      nBtn.textContent = "夜：テスト";
      nBtn.onclick = function() { state.grammarSubTab = 'night'; render(); };
      
      subNav.appendChild(mBtn);
      subNav.appendChild(nBtn);
      container.appendChild(subNav);

      const mainBox = document.createElement('div');
      mainBox.className = "text-center py-4";

      if (state.grammarSubTab === 'morning') {
        const badge = document.createElement('span');
        badge.className = "inline-block px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold mb-4";
        badge.textContent = "問題 " + (state.grammarCardIdx + 1) + " / 5";
        mainBox.appendChild(badge);

        const ruText = document.createElement('div');
        ruText.className = "text-2xl font-bold text-slate-800 mb-6";
        ruText.textContent = cur.ru;
        mainBox.appendChild(ruText);

        if (state.grammarMorningRevealed) {
          const jpText = document.createElement('div');
          jpText.className = "bg-indigo-50 p-4 rounded-xl text-indigo-900 font-medium mb-6";
          jpText.textContent = cur.jp;
          mainBox.appendChild(jpText);
        } else {
          const showBtn = document.createElement('button');
          showBtn.className = "w-full bg-slate-100 hover:bg-slate-200 text-slate-600 py-3 rounded-xl font-bold text-sm mb-6";
          showBtn.textContent = "答えを確認する";
          showBtn.onclick = function() { state.grammarMorningRevealed = true; render(); };
          mainBox.appendChild(showBtn);
        }

        const btnRow = document.createElement('div');
        btnRow.className = "flex justify-between space-x-2";

        const prevBtn = document.createElement('button');
        prevBtn.className = state.grammarCardIdx === 0 ? "opacity-30 px-4 py-2 bg-slate-100 rounded-lg text-sm font-bold text-slate-600" : "px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-bold text-slate-600";
        prevBtn.textContent = "前へ";
        prevBtn.disabled = (state.grammarCardIdx === 0);
        prevBtn.onclick = function() {
          state.grammarCardIdx = Math.max(0, state.grammarCardIdx - 1);
          state.grammarMorningRevealed = false;
          render();
        };

        const nextBtn = document.createElement('button');
        nextBtn.className = state.grammarCardIdx === 4 ? "opacity-30 px-4 py-2 bg-slate-100 rounded-lg text-sm font-bold text-slate-600" : "px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold";
        nextBtn.textContent = "次へ";
        nextBtn.disabled = (state.grammarCardIdx === 4);
        nextBtn.onclick = function() {
          state.grammarCardIdx = Math.min(4, state.grammarCardIdx + 1);
          state.grammarMorningRevealed = false;
          render();
        };

        btnRow.appendChild(prevBtn);
        btnRow.appendChild(nextBtn);
        mainBox.appendChild(btnRow);
      } else {
        if (state.grammarCardIdx < 4) {
          const badgeRow = document.createElement('div');
          badgeRow.className = "flex justify-between items-center mb-4";
          badgeRow.innerHTML = '<span class="px-3 py-1 bg-amber-50 text-amber-600 rounded-full text-xs font-bold">1〜4問目：復習</span><span class="text-xs text-slate-400">' + (state.grammarCardIdx + 1) + ' / 5</span>';
          mainBox.appendChild(badgeRow);

          const ruText = document.createElement('div');
          ruText.className = "text-2xl font-bold text-slate-800 mb-6";
          ruText.textContent = cur.ru;
          mainBox.appendChild(ruText);

          if (state.grammarMorningRevealed) {
            const jpText = document.createElement('div');
            jpText.className = "bg-amber-50 p-4 rounded-xl text-amber-900 font-medium mb-6";
            jpText.textContent = cur.jp;
            mainBox.appendChild(jpText);
          } else {
            const showBtn = document.createElement('button');
            showBtn.className = "w-full bg-slate-100 hover:bg-slate-200 text-slate-600 py-3 rounded-xl font-bold text-sm mb-6";
            showBtn.textContent = "日本語訳を確認する";
            showBtn.onclick = function() { state.grammarMorningRevealed = true; render(); };
            mainBox.appendChild(showBtn);
          }

          const nextBtn = document.createElement('button');
          nextBtn.className = "w-full bg-indigo-600 text-white font-bold py-3 rounded-xl";
          nextBtn.textContent = "次の問題へ";
          nextBtn.onclick = function() {
            state.grammarCardIdx++;
            state.grammarMorningRevealed = false;
            render();
          };
          mainBox.appendChild(nextBtn);
        } else {
          const badge = document.createElement('span');
          badge.className = "px-3 py-1 bg-rose-50 text-rose-600 rounded-full text-xs font-bold mb-4 inline-block";
          badge.textContent = "5問目：タイピング";
          mainBox.appendChild(badge);

          const jpText = document.createElement('div');
          jpText.className = "text-xl font-bold text-slate-800 mb-4 bg-slate-50 p-3 rounded-xl border";
          jpText.textContent = cur.jp;
          mainBox.appendChild(jpText);

          const input = document.createElement('input');
          input.type = "text";
          input.value = state.grammarNightQ5TypedText;
          input.placeholder = "ロシア語を入力...";
          input.className = "w-full p-3 border rounded-xl mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500";
          input.oninput = function(e) { state.grammarNightQ5TypedText = e.target.value; };
          mainBox.appendChild(input);

          const checkBtn = document.createElement('button');
          checkBtn.className = "w-full bg-indigo-600 text-white font-bold py-3 rounded-xl mb-3";
          checkBtn.textContent = "判定";
          checkBtn.onclick = function() { state.grammarNightQ5Checked = true; render(); };
          mainBox.appendChild(checkBtn);

          if (state.grammarNightQ5Checked) {
            const isCorrect = (state.grammarNightQ5TypedText.trim() === cur.ru);
            const resBox = document.createElement('div');
            resBox.className = "p-4 rounded-xl " + (isCorrect ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-800');
            resBox.innerHTML = '<p class="font-bold mb-1">' + (isCorrect ? '◯ 正解です！' : '× 残念！') + '</p><p class="text-sm">正解: ' + cur.ru + '</p>';
            mainBox.appendChild(resBox);
          }

          const resetBtn = document.createElement('button');
          resetBtn.className = "w-full mt-4 text-xs text-slate-400 text-center";
          resetBtn.textContent = "最初からやり直す";
          resetBtn.onclick = function() {
            state.grammarCardIdx = 0;
            state.grammarNightQ5Checked = false;
            state.grammarNightQ5TypedText = '';
            render();
          };
          mainBox.appendChild(resetBtn);
        }
      }
      container.appendChild(mainBox);
    }

    function renderVocab(container, words) {
      if (state.vocabMode === 'study') {
        const listContainer = document.createElement('div');
        listContainer.className = "space-y-3 mb-6";

        words.forEach(function(w) {
          const item = document.createElement('div');
          item.className = "p-3.5 bg-slate-50 border rounded-xl flex items-center justify-between";
          item.innerHTML = '<div><div class="font-bold text-slate-800 text-lg">' + w.ru + '</div><div class="text-xs text-indigo-600 font-medium">' + w.reading + '</div></div><div class="font-bold text-slate-700">' + w.jp + '</div>';
          listContainer.appendChild(item);
        });
        container.appendChild(listContainer);

        const startBtn = document.createElement('button');
        startBtn.className = "w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow hover:bg-indigo-700 transition";
        startBtn.textContent = "テストを開始する";
        startBtn.onclick = function() {
          state.vocabMode = 'test';
          state.vocabNightChecked = {};
          state.vocabNightTyped = {};
          render();
        };
        container.appendChild(startBtn);
      } else {
        const headerRow = document.createElement('div');
        headerRow.className = "flex justify-between items-center mb-4 pb-2 border-b";
        headerRow.innerHTML = '<span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">単語テスト</span>';
        
        const backBtn = document.createElement('button');
        backBtn.className = "text-xs text-slate-400";
        backBtn.textContent = "一覧に戻る";
        backBtn.onclick = function() { state.vocabMode = 'study'; render(); };
        headerRow.appendChild(backBtn);
        container.appendChild(headerRow);

        const testList = document.createElement('div');
        testList.className = "space-y-4";

        words.forEach(function(w, idx) {
          const card = document.createElement('div');
          card.className = "p-3 bg-slate-50 border rounded-xl space-y-2";
          
          const label = document.createElement('div');
          label.className = "text-sm font-bold text-slate-800";
          label.textContent = w.jp + " (" + w.reading + ")";
          card.appendChild(label);

          const input = document.createElement('input');
          input.type = "text";
          input.value = state.vocabNightTyped[idx] || '';
          input.placeholder = "ロシア語を入力...";
          input.className = "w-full p-2 text-sm border rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500";
          input.oninput = function(e) { state.vocabNightTyped[idx] = e.target.value; };
          card.appendChild(input);

          const checkBtn = document.createElement('button');
          checkBtn.className = "w-full py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-lg";
          checkBtn.textContent = "判定";
          checkBtn.onclick = function() { state.vocabNightChecked[idx] = true; render(); };
          card.appendChild(checkBtn);

          if (state.vocabNightChecked[idx]) {
            const isCorrect = ((state.vocabNightTyped[idx] || '').trim() === w.ru);
            const result = document.createElement('div');
            result.className = "text-xs font-bold " + (isCorrect ? 'text-emerald-600' : 'text-rose-600');
            result.textContent = isCorrect ? '◯ 正解！' : ('× 正解: ' + w.ru);
            card.appendChild(result);
          }

          testList.appendChild(card);
        });
        container.appendChild(testList);
      }
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '';

      if (!state.isAuthenticated) {
        const loginCard = document.createElement('div');
        loginCard.className = "bg-white rounded-2xl shadow-xl p-8 mt-12 text-center
